<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ college_name }} | Help Desk Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="crest" aria-hidden="true">SC</div>
        <div>
          <h1>{{ college_name }}</h1>
          <p>Student help desk</p>
        </div>
      </div>
      <h2 class="side-title">Popular questions</h2>
      <div class="chips" id="chips">
        <button class="chip" type="button">How do I apply for admission?</button>
        <button class="chip" type="button">What is the fee structure?</button>
        <button class="chip" type="button">Which courses do you offer?</button>
        <button class="chip" type="button">Is hostel available?</button>
        <button class="chip" type="button">Tell me about placements</button>
        <button class="chip" type="button">Are scholarships available?</button>
        <button class="chip" type="button">What documents are required?</button>
        <button class="chip" type="button">How can I contact the college?</button>
      </div>
    </aside>

    <main class="chat" aria-label="Chat">
      <header class="chat-head">
        <div>
          <h2>Ask the help desk</h2>
          <p><span class="dot" aria-hidden="true"></span>Online, replies instantly</p>
        </div>
        <button id="clearBtn" class="ghost" type="button">Clear chat</button>
      </header>

      <div id="messages" class="messages" role="log" aria-live="polite"></div>

      <form id="chatForm" class="composer" autocomplete="off">
        <label for="userInput" class="sr">Type your question</label>
        <input id="userInput" type="text" maxlength="300" placeholder="Type your question, for example: what is the hostel fee?" required>
        <button type="submit" id="sendBtn">Send</button>
      </form>
    </main>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
